[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "absa"
version = "1.0.0"
description = "Aspect-based sentiment analysis on MEMD-ABSA: quadruple extraction and aspect-level sentiment classification"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
